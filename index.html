<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apartha Countdown</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            background: black;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #countdown {
            font-size: 60px;
            font-weight: bold;
        }

        @media (max-width: 600px) {
            #countdown {
                font-size: 35px;
            }
        }
    </style>
</head>

<body>

    <div id="countdown">Loading...</div>

    <script>
        const countdown = document.getElementById("countdown");

        // The countdown ends at midnight in Tehran
        const endTime = new Date("2027-01-01T00:00:00+03:30").getTime();

        let clockOffset = 0;

        async function getTime() {
            try {
                const before = Date.now();

                const result = await fetch(
                    "https://worldtimeapi.org/api/timezone/Etc/UTC"
                );

                const data = await result.json();
                const after = Date.now();

                const serverTime = new Date(data.utc_datetime).getTime();
                clockOffset = serverTime - ((before + after) / 2);
            } catch (error) {
                clockOffset = 0;
            }
        }

        function update() {
            let left = endTime - (Date.now() + clockOffset);

            if (left <= 0) {
                countdown.textContent = "00:00:00:00";
                return;
            }

            let totalSeconds = Math.floor(left / 1000);

            const days = Math.floor(totalSeconds / 86400);
            totalSeconds %= 86400;

            const hours = Math.floor(totalSeconds / 3600);
            totalSeconds %= 3600;

            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;

            countdown.textContent =
                String(days).padStart(2, "0") + ":" +
                String(hours).padStart(2, "0") + ":" +
                String(minutes).padStart(2, "0") + ":" +
                String(seconds).padStart(2, "0");
        }

        async function start() {
            await getTime();
            update();

            setInterval(update, 1000);
        }

        start();
    </script>

</body>
</html>
