<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Doomsday</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #000;
            color: white;
            font-family: Arial, Helvetica, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 1000px;
        }

        .warning {
            color: #ff3030;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 5px;
            margin-bottom: 25px;
        }

        h1 {
            margin: 0;
            font-size: clamp(40px, 8vw, 90px);
            font-weight: 900;
            letter-spacing: 3px;
        }

        .subtitle {
            margin: 20px 0 50px;
            color: #777;
            font-size: 18px;
        }

        #countdown {
            color: #ff3030;
            font-size: clamp(40px, 8vw, 90px);
            font-weight: 900;
            letter-spacing: 2px;

            text-shadow:
                0 0 10px rgba(255, 48, 48, 0.5),
                0 0 30px rgba(255, 48, 48, 0.2);
        }

        .date {
            margin-top: 30px;
            color: #444;
            font-size: 13px;
            letter-spacing: 2px;
        }

        .dead {
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% {
                opacity: 1;
            }

            50% {
                opacity: 0.3;
            }

            100% {
                opacity: 1;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="warning">
            ⚠ SERVER STATUS: CRITICAL ⚠
        </div>

        <h1>
            SERVER DOOMSDAY
        </h1>

        <div class="subtitle">
            Nobody is talking anymore.
        </div>

        <div id="countdown">
            Loading...
        </div>

        <div class="date">
            JANUARY 1, 2027 — 00:00:00 UTC
        </div>

    </div>

    <script>

        // Fixed end date.
        // This NEVER resets when the page is refreshed.

        const END_DATE = new Date(
            "2027-01-01T00:00:00Z"
        ).getTime();


        function updateCountdown() {

            const now = Date.now();

            const difference = END_DATE - now;

            const countdown = document.getElementById("countdown");


            // Countdown has reached zero.

            if (difference <= 0) {

                countdown.textContent = "SERVER DEAD 💀";

                countdown.classList.add("dead");

                return;
            }


            // Convert milliseconds to seconds.

            const totalSeconds = Math.floor(
                difference / 1000
            );


            // Calculate the time remaining.

            const days = Math.floor(
                totalSeconds / 86400
            );

            const hours = Math.floor(
                (totalSeconds % 86400) / 3600
            );

            const minutes = Math.floor(
                (totalSeconds % 3600) / 60
            );

            const seconds = totalSeconds % 60;


            // Add leading zeros.

            const h = String(hours).padStart(2, "0");

            const m = String(minutes).padStart(2, "0");

            const s = String(seconds).padStart(2, "0");


            // Display the countdown.

            countdown.textContent =
                `${days}d ${h}h ${m}m ${s}s`;
        }


        // Run immediately.

        updateCountdown();


        // Update once every second.

        setInterval(
            updateCountdown,
            1000
        );

    </script>

</body>
</html>
